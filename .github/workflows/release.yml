name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: Release Linux x86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CTEST_OUTPUT_ON_FAILURE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ git libcurl4-openssl-dev ninja-build

      - name: Configure release
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBENGAL_MARKET_BUILD_TESTS=ON
          -DBENGAL_MARKET_ENABLE_SANITIZERS=OFF

      - name: Build and test
        run: |
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Install staging tree
        run: cmake --install build --prefix staging/usr/local

      - name: Create reproducible archive
        run: |
          archive="bengal-market-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
          source_date_epoch="$(git log -1 --pretty=%ct)"
          tar \
            --sort=name \
            --mtime="@${source_date_epoch}" \
            --owner=0 --group=0 --numeric-owner \
            -C staging -czf "${archive}" .
          sha256sum "${archive}" > SHA256SUMS
          mkdir -p artifacts
          mv "${archive}" SHA256SUMS artifacts/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bengal-market-${{ github.ref_name }}-linux-x86_64
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/bengal-market-${{ github.ref_name }}-linux-x86_64.tar.gz
            artifacts/SHA256SUMS
