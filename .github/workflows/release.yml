name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: Release Linux x86-64
    runs-on: ubuntu-24.04
    container: rockylinux:9
    timeout-minutes: 25
    env:
      CTEST_OUTPUT_ON_FAILURE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y \
            binutils cmake gcc-c++ git gzip make openssl-devel python3 tar

      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          project_version="$(
            sed -n 's/^set(BENGAL_MARKET_VERSION \([^)]*\))$/\1/p' \
              CMakeLists.txt
          )"
          if [[ "${GITHUB_REF_NAME}" != "v${project_version}" ]]; then
            echo "Tag does not match project version ${project_version}." >&2
            exit 1
          fi

      - name: Configure release
        run: >-
          cmake -S . -B build -G "Unix Makefiles"
          -DCMAKE_BUILD_TYPE=Release
          -DBENGAL_MARKET_BUILD_TESTS=ON
          -DBENGAL_MARKET_ENABLE_SANITIZERS=OFF

      - name: Build and test
        run: |
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Install staging tree
        run: |
          cmake --install build --prefix staging/usr/local
          test "$(
            staging/usr/local/bin/bengal-market --version
          )" = "bengal-market ${GITHUB_REF_NAME#v}"
          if ldd staging/usr/local/bin/bengal-market |
              grep -E 'libcurl|libssh|libnghttp|libpsl|libbrotli|libzstd'; then
            echo "Release has an unexpected optional curl dependency." >&2
            exit 1
          fi
          staging/usr/local/bin/bengal-market generate \
            --output release-fixture.jsonl --events 2000
          staging/usr/local/bin/bengal-market benchmark \
            --input release-fixture.jsonl \
            --output release-evidence \
            --runs 2 --warmup 1
          test -f release-evidence/manifest.json

      - name: Validate runtime compatibility
        run: |
          binary=staging/usr/local/bin/bengal-market
          required_glibc="$(
            readelf --version-info "${binary}" |
              grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' |
              sed 's/^GLIBC_//' |
              sort -Vu
          )"
          max_glibc="$(
            printf '%s\n' 2.34 "${required_glibc}" |
              sort -V |
              tail -n 1
          )"
          if [[ "${max_glibc}" != "2.34" ]]; then
            echo "Release requires glibc ${max_glibc}; maximum is 2.34." >&2
            exit 1
          fi
          required_openssl="$(
            readelf --version-info "${binary}" |
              grep -oE 'OPENSSL_[0-9]+(\.[0-9]+)+' |
              sed 's/^OPENSSL_//' |
              sort -Vu
          )"
          max_openssl="$(
            printf '%s\n' 3.0.0 "${required_openssl}" |
              sort -V |
              tail -n 1
          )"
          if [[ "${max_openssl}" != "3.0.0" ]]; then
            echo "Release requires OpenSSL ${max_openssl}; maximum is 3.0.0." >&2
            exit 1
          fi
          readelf --version-info "${binary}"

      - name: Create reproducible archive
        run: |
          archive="bengal-market-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
          source_date_epoch="$(git log -1 --pretty=%ct)"
          tar \
            --sort=name \
            --mtime="@${source_date_epoch}" \
            --owner=0 --group=0 --numeric-owner \
            -C staging -czf "${archive}" .
          sha256sum "${archive}" > SHA256SUMS
          mkdir -p artifacts
          mv "${archive}" SHA256SUMS artifacts/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bengal-market-${{ github.ref_name }}-linux-x86_64
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/bengal-market-${{ github.ref_name }}-linux-x86_64.tar.gz
            artifacts/SHA256SUMS
